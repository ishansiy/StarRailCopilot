services:
  starrail-copilot:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${SRC_BASE_IMAGE:-bgzerol/starrailcopilot:slim@sha256:fb3cc1d3d180f381c81e5a05683782fbbf02590613abf5f59c65b2f12762745f}
    image: ${SRC_IMAGE:-ghcr.io/ishansiy/starrailcopilot:latest}
    restart: unless-stopped
    environment:
      PORT: "22367"
      TZ: ${TZ:-Asia/Shanghai}
      SRC_WEBUI_PASSWORD: ${SRC_WEBUI_PASSWORD:?请在 .env 中设置 SRC_WEBUI_PASSWORD}
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-starrail-copilot}
      TS_STATE_DIR: /var/lib/tailscale
      SRC_TAILSCALE_ADB_HOST: ${SRC_TAILSCALE_ADB_HOST:-}
      SRC_TAILSCALE_ADB_PORT: ${SRC_TAILSCALE_ADB_PORT:-5555}
      SRC_TAILSCALE_ADB_LOCAL_PORT: ${SRC_TAILSCALE_ADB_LOCAL_PORT:-5555}
      SRC_TAILSCALE_ADB_PAIR_PORT: ${SRC_TAILSCALE_ADB_PAIR_PORT:-}
      SRC_TAILSCALE_ADB_PAIR_CODE: ${SRC_TAILSCALE_ADB_PAIR_CODE:-}
      SRC_TAILSCALE_ADB_PAIR_LOCAL_PORT: ${SRC_TAILSCALE_ADB_PAIR_LOCAL_PORT:-37000}
      SRC_TAILSCALE_ADB_CONNECT_TIMEOUT_SECONDS: ${SRC_TAILSCALE_ADB_CONNECT_TIMEOUT_SECONDS:-10}
      SRC_TAILSCALE_ADB_RETRY_SECONDS: ${SRC_TAILSCALE_ADB_RETRY_SECONDS:-15}
      SRC_TAILSCALE_REQUIRED: ${SRC_TAILSCALE_REQUIRED:-1}
    ports:
      - "${SRC_WEBUI_PORT:-22367}:22367"
    volumes:
      - ./data/config:/app/config
      - ./data/log:/app/log
      - ./data/tailscale:/var/lib/tailscale
      - ./data/android:/root/.android
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:22367/', timeout=4)
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    stop_grace_period: 30s
