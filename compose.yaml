services:
  starrail-copilot:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${SRC_BASE_IMAGE:-bgzerol/starrailcopilot:slim@sha256:fb3cc1d3d180f381c81e5a05683782fbbf02590613abf5f59c65b2f12762745f}
    image: ${SRC_IMAGE:-ghcr.io/ishansiy/starrailcopilot:latest}
    restart: unless-stopped
    environment:
      PORT: "22367"
      TZ: ${TZ:-Asia/Shanghai}
      SRC_WEBUI_PASSWORD: ${SRC_WEBUI_PASSWORD:?请在 .env 中设置 SRC_WEBUI_PASSWORD}
    ports:
      - "${SRC_WEBUI_PORT:-22367}:22367"
    volumes:
      - ./data/config:/app/config
      - ./data/log:/app/log
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:22367/', timeout=4)
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    stop_grace_period: 30s
