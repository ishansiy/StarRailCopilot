name: Publish container image

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/ishansiy/starrailcopilot

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.24.3 pillow==9.5.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-

      - name: Validate container support
        run: |
          sh -n deploy/docker-entrypoint.sh
          python -m py_compile deploy/tailscale-adb-forwarder.py deploy/configure-adb-serial.py deploy/adb-device-state.py deploy/managed_adb_resolution.py deploy/test_managed_joystick_contact.py deploy/test_wave_slider_target_one.py module/device/control.py module/device/device.py module/device/managed_screenshot_crop.py module/device/method/adb_shell_patch.py module/device/method/minitouch.py module/device/method/maatouch.py module/device/method/utils.py module/device/screenshot.py module/webui/process_manager.py tasks/map/control/joystick.py tasks/item/slider.py
          python -m unittest deploy.test_container_support deploy.test_managed_adb_resolution deploy.test_managed_screenshot_crop deploy.test_managed_screenshot_runtime deploy.test_managed_touch_crop deploy.test_managed_control_guard deploy.test_managed_joystick_contact deploy.test_process_manager_resolution deploy.test_scheduler_start deploy.test_guide_ui_assets deploy.test_wave_slider_target_one

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
